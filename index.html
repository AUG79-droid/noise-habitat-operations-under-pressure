/* Interactive mission avatar */

.courseHeroMain,.courseHeroSide{border:1px solid rgba(76,215,246,.28);background:linear-gradient(150deg,rgba(18,36,59,.96),rgba(8,20,36,.98));padding:26px;box-shadow:0 18px 46px rgba(0,0,0,.34)}
.courseHero h1{margin:0 0 10px;font-size:clamp(32px,4vw,54px);line-height:1.02;letter-spacing:-.035em;color:#fff}.courseHero p{margin:0;color:#c6d6e3;font-size:15px;line-height:1.65}
.courseHeroSide{display:flex;flex-direction:column;justify-content:space-between;border-color:rgba(245,160,245,.24)}
.courseHeroSide .bigNum{font:900 54px/1 ui-monospace,Consolas,monospace;color:var(--pink);text-shadow:0 0 24px rgba(245,160,245,.22)}
.courseHeroSide small{display:block;color:#8399ac;font:900 8px ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.courseHeroSide strong{display:block;color:#fff;font-size:15px;line-height:1.35}
.courseHow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 26px}.courseHow .item{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025);padding:15px}.courseHow b{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--cyan);color:var(--cyan);font:900 10px ui-monospace,Consolas,monospace;margin-bottom:9px}.courseHow strong{display:block;color:#fff;font-size:13px;margin-bottom:4px}.courseHow span{display:block;color:#9fb4c7;font-size:11px;line-height:1.45}
.missionOverviewGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 28px}.missionOverviewCard{position:relative;overflow:hidden;border:1px solid rgba(76,215,246,.18);background:linear-gradient(155deg,rgba(12,29,49,.96),rgba(7,18,32,.98));padding:18px;min-height:205px}.missionOverviewCard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--cyan),var(--pink))}.missionOverviewCard small{display:block;color:var(--pink);font:900 8px ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}.missionOverviewCard h3{margin:6px 0 8px;color:#fff;font-size:18px;line-height:1.08}.missionOverviewCard p{margin:0 0 10px;color:#b9cbd8;font-size:12px;line-height:1.5}.missionOverviewCard .missionDo{border-top:1px solid rgba(255,255,255,.08);padding-top:9px;color:#e2eef6;font-size:11px;line-height:1.45}.missionOverviewCard .missionDo strong{color:var(--cyan)}
.courseSectionTitle{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:28px 0 12px}.courseSectionTitle h2{margin:0;color:#fff;font-size:26px;line-height:1.05}.courseSectionTitle span{color:#8298aa;font:800 9px ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
.theoryGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.theoryCard{border:1px solid rgba(255,255,255,.09);background:linear-gradient(155deg,rgba(14,32,53,.94),rgba(8,20,36,.98));padding:18px}.theoryCard.accent{border-color:rgba(76,215,246,.28);background:linear-gradient(155deg,rgba(11,39,60,.94),rgba(8,20,36,.98))}.theoryCard.pink{border-color:rgba(245,160,245,.24)}.theoryCard small{display:block;color:#839aad;font:900 8px ui-monospace,Consolas,monospace;letter-spacing:.11em;text-transform:uppercase;margin-bottom:6px}.theoryCard h3{margin:0 0 8px;color:#fff;font-size:18px;line-height:1.15}.theoryCard p{margin:0;color:#bdcfdb;font-size:12px;line-height:1.58}.theoryCard ul{margin:10px 0 0 18px;padding:0;color:#bdcfdb;font-size:12px;line-height:1.55}.theoryCard li{margin:4px 0}.theoryCard strong{color:#fff}
.theoryLink{margin:14px 0;border-left:4px solid var(--amber);background:rgba(255,191,90,.055);padding:14px 16px;color:#dce8f1;font-size:12px;line-height:1.55}.theoryLink strong{color:#fff}.theoryTakeaway{margin:14px 0 20px;border:1px solid rgba(245,160,245,.22);background:linear-gradient(145deg,rgba(245,160,245,.065),rgba(76,215,246,.045));padding:18px}.theoryTakeaway small{display:block;color:var(--pink);font:900 8px ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}.theoryTakeaway strong{display:block;color:#fff;font-size:18px;line-height:1.35}.theoryTakeaway p{margin:7px 0 0;color:#bfd0dd;font-size:12px;line-height:1.55}
.courseActions{position:static;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;padding:14px 16px;background:rgba(6,15,30,.96);border:1px solid rgba(76,215,246,.30);box-shadow:0 -10px 36px rgba(0,0,0,.32)}.courseActions .progressText{color:#9fb4c7;font:800 9px ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}.courseBtn{border:1px solid var(--cyan);background:var(--cyan);color:#04101c;font:900 10px ui-monospace,Consolas,monospace;letter-spacing:.07em;text-transform:uppercase;padding:12px 16px;cursor:pointer}.courseBtn.secondary{background:transparent;color:var(--cyan)}
.theoryLaunch{position:absolute;z-index:16;border:1px solid #7be7ff;background:linear-gradient(180deg,#52defb,#31c7e8);color:#04111c;font:900 10px ui-monospace,Consolas,monospace;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 22px rgba(76,215,246,.30)}.theoryLaunch:hover{filter:brightness(1.08)}
@media(max-width:900px){.courseHero{grid-template-columns:1fr}.courseHow{grid-template-columns:repeat(2,1fr)}.missionOverviewGrid{grid-template-columns:1fr 1fr}.theoryGrid{grid-template-columns:1fr}}
@media(max-width:600px){.coursePage{padding-top:20px}.courseInner{width:min(100% - 22px,1180px)}.courseHow,.missionOverviewGrid{grid-template-columns:1fr}.courseHeroMain,.courseHeroSide{padding:20px}.courseActions{align-items:stretch;flex-direction:column}.courseActions>div:last-child{display:flex;width:100%;gap:8px}.courseBtn{flex:1}}

</style>

const theoryLessons={
 1:{title:'Environmental noise and operational control',subtitle:'Why the same required activity can create different consequences',time:'5–7 min theory class',cards:[
  ['CORE CONCEPT','Noise is source + path + receptor','Environmental noise is not defined by the source alone. The consequence depends on <strong>what produces the sound</strong>, how it propagates through the environment and <strong>who or what receives it</strong>. Weather, distance, barriers, terrain and operating conditions can all change the exposure at a receptor.'],
  ['READING THE SIGNAL','What dB(A) tells you — and what it does not','A-weighted decibels are used to describe sound in a way that broadly reflects human hearing sensitivity. A displayed dB(A) value can help compare scenarios, but <strong>one number by itself does not prove legal compliance or non-compliance</strong>. Location, duration, measurement method and applicable criteria also matter.'],
  ['OPERATIONAL CONTROL','Reduce avoidable disturbance without cancelling the mission','Operational control can act on the <strong>source, timing, location, duration or procedure</strong>. In an In-Service context the goal is often not “zero noise”; it is to complete a required activity while avoiding disturbance that could reasonably be reduced through planning and control.'],
  ['MANAGEMENT SYSTEM LINK','From environmental aspect to controlled operation','In an environmental management system, significant interactions need appropriate controls. A useful control is clear enough to be implemented, linked to the actual operating conditions and capable of being checked. If the conditions that justified the original plan change, the control may need to be reassessed.']
 ],link:'Mission 01 simulated this by keeping the engine test mandatory while allowing you to change <strong>when or where</strong> it happened.',take:'A noisy activity can be operationally necessary and still be environmentally managed. The key is to understand the conditions that determine exposure and to use proportionate controls.'},
 2:{title:'Spatial planning, sensitive receptors and habitat interaction',subtitle:'Moving an operation is useful only when the overall interaction is understood',time:'5–7 min theory class',cards:[
  ['SPATIAL THINKING','A map is a control tool, not just a picture','Spatial planning identifies where an activity overlaps with <strong>communities, protected or sensitive habitats, wildlife movement areas and other receptors</strong>. It helps planners see consequences that are easy to miss when looking only at the operation itself.'],
  ['IMPACT TRANSFER','Reducing one impact can increase another','Moving a route away from a residential receptor may reduce community disturbance but increase interaction with habitat. A credible sustainability decision therefore asks: <strong>where did the impact go?</strong> A local improvement is not automatically an overall improvement.'],
  ['HABITAT CONTEXT','Sensitivity varies across space and time','Habitat value is not uniform. Different areas may provide feeding, breeding, resting or connectivity functions, and wildlife activity can vary seasonally or temporarily. Spatial controls are stronger when they use the best available context rather than treating every area as identical.'],
  ['CUMULATIVE VIEW','Look beyond the most visible receptor','A route may interact with several receptors during one activity. Good planning considers the <strong>combined pattern of disturbance</strong>, not only the single hotspot that is easiest to see. This prevents solving one problem by transferring it elsewhere.']
 ],link:'Mission 02 made you compare three fictional corridors and forced you to consider both community and habitat instead of choosing the route with the simplest visual line.',take:'Spatial sustainability means choosing location with awareness of sensitive receptors, habitat functions and impact transfer — not simply moving the disturbance off one map point.'},
 3:{title:'Adaptive management and changing habitat conditions',subtitle:'Why an approved plan may need to change when the environment changes',time:'5–7 min theory class',cards:[
  ['DYNAMIC CONDITIONS','Environmental conditions are not static','Wildlife presence, weather, habitat use and operational context can change between planning and execution. A plan may be reasonable when approved and still become inappropriate later if a relevant condition changes.'],
  ['MONITORING','Monitoring only matters if it can inform action','Collecting live information is not an environmental control by itself. The useful question is: <strong>what decision changes when the signal changes?</strong> Monitoring should be linked to trigger points, review rules or contingency actions.'],
  ['TRIGGER POINTS','Separate “new information” from “action required”','Not every environmental update requires a change. A practical system distinguishes between information to watch and a condition that actually crosses a defined decision trigger — for example, a new overlap with a sensitive area during the planned window.'],
  ['ADAPTIVE CONTROL','Prepare alternatives before the conflict occurs','Adaptive management is stronger when the team already knows what alternatives are available: wait, reassess, use a backup zone, modify timing or apply another approved control. This preserves readiness while making the response faster and more defensible.']
 ],link:'Mission 03 showed the same plan at three moments: acceptable, alert, and active conflict. The decision only became necessary when the live condition overlapped the approved plan.',take:'An environmental plan is not a one-time approval. It is a controlled decision that may need to adapt when relevant conditions change.'},
 4:{title:'Night-time noise, sensitivity and scheduling control',subtitle:'How timing can change the consequence of the same operation',time:'5–7 min theory class',cards:[
  ['TIME MATTERS','The same source can be experienced differently at different times','Community sensitivity can change with time of day because normal activities, background sound and expectations are different. Night periods are generally more sensitive to disturbance, particularly where people are resting or sleeping.'],
  ['READINESS MARGIN','Later is not automatically better','Delaying an operation can reduce one interaction but leave less time to recover from technical problems, repeat a test or meet a readiness handover. A timing decision therefore needs to consider <strong>environmental sensitivity and operational margin together</strong>.'],
  ['HABITAT AT NIGHT','Ecological activity can also vary by time','Many species change their activity through the day and night. A time window that is quieter for the community is not automatically lower-impact for habitat. Timing controls should therefore read both human and ecological receptors where relevant.'],
  ['SCHEDULING AS CONTROL','Use the window as part of the procedure','A robust scheduling control defines when an activity is preferable, what conditions must be checked and what margin must remain. It should not rely on a vague assumption such as “earlier is always better” or “night is always prohibited”.']
 ],link:'Mission 04 kept the activity identical and changed only the window, so you could see how community sensitivity, habitat activity and readiness margin move independently.',take:'Timing is an environmental control when it is chosen deliberately from current sensitivity and operational constraints — not simply from habit or convenience.'},
 5:{title:'Environmental noise investigation and corrective action',subtitle:'From complaint to evidence, cause and prevention',time:'6–8 min theory class',cards:[
  ['COMPLAINT ≠ CONCLUSION','A complaint is a signal that deserves investigation','A community complaint can indicate meaningful disturbance, but it does not by itself prove the cause or a legal exceedance. Investigation starts by reconstructing <strong>what happened, when, under which conditions and at which receptor</strong>.'],
  ['SOURCE–PATH–RECEPTOR','Investigate the full acoustic chain','Useful evidence can include source activity, timing, duration, weather and propagation, receptor location, monitoring records and the operational control that was expected to be applied. This helps distinguish the measured consequence from the underlying cause.'],
  ['ROOT CAUSE','Do not stop at the visible symptom','“The noise was high” describes an outcome. Root-cause thinking asks why the control allowed that outcome to become more likely. In the game, changed wind and timing mattered because the pre-execution noise condition was not revalidated.'],
  ['CORRECTIVE ACTION','Fix the cause and verify recurrence risk','A corrective action should address the identified cause and be proportionate. After implementation, the organisation still needs to verify whether the new control is being used and whether it actually reduces recurrence. Closing the complaint is not the same as improving the control.']
 ],link:'Mission 05 deliberately separated four evidence items before asking you to build a finding. That sequence mirrors good investigation logic: <strong>evidence first, conclusion second, corrective action third</strong>.',take:'Sustainable noise management learns from unwanted outcomes. The objective is not to defend the old plan, but to strengthen the control using evidence.'},
 6:{title:'Environmental Management System audits and ISO 14001 logic',subtitle:'What an audit is really trying to establish',time:'7–10 min theory class',cards:[
  ['PURPOSE OF AN AUDIT','Evidence, conformity and effectiveness','An environmental management system audit is a structured review of whether defined requirements and controls are being implemented and whether the system can produce reliable environmental management. It is <strong>evidence-based</strong>; it is not a search for a perfect organisation.'],
  ['AUDIT TRAIL','Follow the chain from requirement to evidence','A useful audit trail connects the environmental issue to a control, shows how the control was implemented, checks records or observations, and follows what happened when conditions changed or a failure occurred. Statements such as “we normally do this” are weaker than traceable evidence.'],
  ['FINDINGS','Strengths, partial evidence and gaps can coexist','An audit conclusion can recognise controls that work and still identify gaps requiring follow-up. Hiding weaknesses makes the conclusion less credible. A management system is stronger when it can detect a problem, record it, correct it and verify improvement.'],
  ['ISO 14001 MANAGEMENT LOOP','Plan, operate, evaluate and improve','The standard uses a management-system logic built around environmental aspects, objectives and controls, operational implementation, monitoring and evaluation, corrective action and continual improvement. The exact audit scope and criteria must always be defined for the real organisation.'],
  ['AUDITOR MINDSET','Ask “show me” rather than “tell me”','The auditor looks for objective evidence: records, monitoring data, decisions, responsibilities, corrective actions and follow-up. The question is not whether every result was favourable; it is whether the organisation can <strong>demonstrate control and learning</strong>.'],
  ['LIMIT OF THIS SIMULATION','Training logic, not certification','This mission illustrates environmental-management and audit reasoning. It does not determine conformity with ISO 14001, replace a real audit programme or provide formal auditor qualification.']
 ],link:'Mission 06 reused evidence from Missions 01–05 so the final conclusion depended on the controls and decisions you actually made instead of on memorising clause numbers.',take:'A credible environmental management system is visible in the evidence chain: identify → control → monitor → adapt → investigate → correct → verify → improve.'}
};

function openBriefing1(first=false){modalCard.className='modal wide';modalContent.innerHTML=`<div class="eyebrow">Mission 01 · Before you start</div><h2>Your job: complete the engine test without creating an avoidable conflict.</h2><p class="lead">The engine test has to happen. You are deciding <strong>how to run it</strong> under the conditions around the base.</p><div class="missionCore"><div class="coreCard"><small>WHO YOU ARE</small><strong>In-Service Operations Planner</strong><span>You plan required activities at a fictional air base.</span></div><div class="coreCard"><small>WHAT MUST HAPPEN</small><strong>Complete the engine test</strong><span>Two aircraft need testing before tomorrow's operational window.</span></div><div class="coreCard"><small>WHAT YOU BALANCE</small><strong>Readiness + disturbance</strong><span>Keep aircraft ready while controlling noise, community and habitat interaction.</span></div></div><div class="plainFlow"><div class="plainStep"><b>1</b><strong>Choose the required operation</strong><span>Start with the Ground Run engine test.</span></div><div class="plainStep"><b>2</b><strong>Compare 3 ways to execute it</strong><span>Run now, delay 30 minutes or move test area.</span></div><div class="plainStep"><b>3</b><strong>See what your choice causes</strong><span>Readiness, community and habitat respond differently.</span></div></div><div class="modalActions"><button class="btn secondary" id="briefIntel">WHAT DO THE INDICATORS MEAN?</button><button class="btn" id="briefGo">START PLANNING</button></div>`;openModal();document.getElementById('briefIntel').onclick=()=>{closeModal();render('map1');setTimeout(openIntel1,40)};document.getElementById('briefGo').onclick=()=>{closeModal();guideSteps.map1=0;guideOpen=true;render('map1')}}

function openBriefing2(first=false){modalCard.className='modal wide';modalContent.innerHTML=`<div class="eyebrow">Mission 02 · Training Route Conflict</div><h2>One required flight. Three possible routes.</h2><p class="lead">A fictional training sortie must be completed. Your decision is simple: <strong>choose the route</strong>. Each route keeps the mission going, but sends disturbance toward different places.</p><div class="missionCore"><div class="coreCard"><small>WHAT MUST HAPPEN</small><strong>The training sortie</strong><span>You cannot cancel it.</span></div><div class="coreCard"><small>WHAT YOU CAN CHANGE</small><strong>The route</strong><span>A, B or C.</span></div><div class="coreCard"><small>WHAT YOU ARE TRYING TO AVOID</small><strong>Unnecessary disturbance</strong><span>Community + wetland + bird corridor.</span></div></div><div class="ruleBox"><strong>How the game works:</strong> I will show Route A, then Route B, then Route C. Read one plain-language consequence for each. After the third route, you will compare them side by side and choose.</div><div class="plainFlow"><div class="plainStep"><b>1</b><strong>Look at Route A</strong><span>What does it expose?</span></div><div class="plainStep"><b>2</b><strong>Next: Route B</strong><span>Does the problem move elsewhere?</span></div><div class="plainStep"><b>3</b><strong>Next: Route C</strong><span>What trade-off does it make?</span></div><div class="plainStep"><b>4</b><strong>Compare & choose</strong><span>Make one final decision.</span></div></div><div class="modalActions"><button class="btn secondary" id="brief2Intel">WHAT DO COMMUNITY / HABITAT MEAN?</button><button class="btn" id="brief2Go">START ROUTE REVIEW</button></div>`;openModal();document.getElementById('brief2Intel').onclick=()=>{closeModal();render('map2');setTimeout(openIntel2,40)};document.getElementById('brief2Go').onclick=()=>{closeModal();routeReviewIndex2=0;viewedRoutes2=new Set();guideSteps.map2=0;guideOpen=true;render('map2')}}
function openIntel2(){modalCard.className='modal';modalContent.innerHTML=`<div class="eyebrow">Mission 02 · Quick Intel</div><h2>You only need to understand three things</h2><p class="lead">Forget flight-planning terminology. In this game, simply ask where each route sends disturbance.</p><div class="modalGrid"><div class="fact"><small>COMMUNITY</small><strong>People living near the route</strong><em>Higher nearby exposure can mean more disturbance and complaints.</em></div><div class="fact"><small>WETLAND</small><strong>Sensitive habitat</strong><em>Moving away from people is not automatically better if disturbance is transferred here.</em></div><div class="fact"><small>BIRD CORRIDOR</small><strong>Seasonal wildlife activity</strong><em>Another receptor that has to be considered in the fictional scenario.</em></div><div class="fact"><small>READINESS</small><strong>Operational margin</strong><em>A longer route may use more time but can still complete the mission.</em></div></div><div class="intelExplain"><strong>The question you are answering:</strong> “Which route completes the required activity while avoiding the most unnecessary disturbance overall?”</div><div class="modalActions"><button class="btn" id="intel2Go">BACK TO CURRENT ROUTE</button></div>`;openModal();document.getElementById('intel2Go').onclick=closeModal}

function openBriefing3(first=false){modalCard.className='modal wide';modalContent.innerHTML=`<div class="eyebrow">Mission 03 · Migration Alert</div><h2>The plan is approved. Then the environment changes.</h2><p class="lead">A fictional training activity is already scheduled. Live habitat monitoring now detects a temporary increase in wildlife movement near the approved activity corridor.</p><div class="missionCore"><div class="coreCard"><small>WHAT MUST HAPPEN</small><strong>The scheduled activity</strong><span>It still needs to be completed today.</span></div><div class="coreCard"><small>WHAT CHANGES</small><strong>Live habitat conditions</strong><span>A temporary wildlife pulse appears after approval.</span></div><div class="coreCard"><small>YOUR DECISION</small><strong>Adapt or keep the plan</strong><span>Continue, hold briefly or use the backup zone.</span></div></div><div class="ruleBox"><strong>How the game works:</strong> ARIA explains the rule once. After that, the monitor gives you <strong>one main action at a time</strong>: show the wildlife alert, show the conflict, then compare responses. Once a state has appeared, you can return to it from the timeline.</div><div class="plainFlow"><div class="plainStep"><b>1</b><strong>See the approved plan</strong><span>No conflict yet.</span></div><div class="plainStep"><b>2</b><strong>Read the live alert</strong><span>Something has changed.</span></div><div class="plainStep"><b>3</b><strong>Respond to the conflict</strong><span>Choose how to adapt.</span></div></div><div class="modalActions"><button class="btn secondary" id="brief3Intel">WHAT IS A LIVE HABITAT ALERT?</button><button class="btn" id="brief3Go">START LIVE MONITORING</button></div>`;openModal();document.getElementById('brief3Intel').onclick=()=>{closeModal();render('map3');setTimeout(openIntel3,40)};document.getElementById('brief3Go').onclick=()=>{closeModal();alertStep3=0;maxAlertStep3=0;guideSteps.map3=0;guideOpen=true;render('map3')}}
function openIntel3(){modalCard.className='modal';modalContent.innerHTML=`<div class="eyebrow">Mission 03 · Quick Intel</div><h2>A live alert means the context changed</h2><p class="lead">You do not need wildlife expertise. The game asks one simple question: <strong>does the original plan still make sense after new information appears?</strong></p><div class="modalGrid"><div class="fact"><small>APPROVED PLAN</small><strong>A decision made with earlier information</strong><em>It can be valid when approved and still need review later.</em></div><div class="fact"><small>WILDLIFE ACTIVITY</small><strong>A temporary fictional movement pulse</strong><em>It represents a time-varying habitat interaction.</em></div><div class="fact"><small>TRIGGER</small><strong>Overlap becomes active</strong><em>This is the point where a new operational decision is required.</em></div><div class="fact"><small>ADAPTIVE CONTROL</small><strong>Change the response if the context changes</strong><em>Monitoring is useful only when it can inform action.</em></div></div><div class="intelExplain"><strong>ISO 14001 connection:</strong> operational controls may need monitoring and adjustment when relevant conditions change. The scenario is fictional and does not represent a real operational procedure.</div><div class="modalActions"><button class="btn" id="intel3Go">BACK TO LIVE MONITOR</button></div>`;openModal();document.getElementById('intel3Go').onclick=closeModal}


function openBriefing4(first=false){modalCard.className='modal wide';modalContent.innerHTML=`<div class="eyebrow">Mission 04 · Night Operations</div><h2>Same required activity. Different time windows.</h2><p class="lead">A fictional 40-minute validation activity must be completed tonight before the 00:30 readiness handover. Your control variable is <strong>when</strong> it happens.</p><div class="missionCore"><div class="coreCard"><small>WHAT MUST HAPPEN</small><strong>The night validation activity</strong><span>It must finish before the fictional handover.</span></div><div class="coreCard"><small>WHAT YOU CAN CHANGE</small><strong>The time window</strong><span>20:30, 22:00 or 23:30.</span></div><div class="coreCard"><small>WHAT CHANGES WITH TIME</small><strong>Sensitivity + margin</strong><span>Community, habitat and readiness conditions are different in each window.</span></div></div><div class="ruleBox"><strong>How the game works:</strong> ARIA explains the rule once. Then you see <strong>one time window at a time</strong>. Reveal all three, go back if you want to compare them again, and only then choose.</div><div class="plainFlow"><div class="plainStep"><b>1</b><strong>Review Window A</strong><span>What is sensitive at 20:30?</span></div><div class="plainStep"><b>2</b><strong>Reveal B and C</strong><span>How do the conditions change?</span></div><div class="plainStep"><b>3</b><strong>Compare & schedule</strong><span>Choose the trade-off you can justify.</span></div></div><div class="modalActions"><button class="btn secondary" id="brief4Intel">WHAT DOES NIGHT SENSITIVITY MEAN?</button><button class="btn" id="brief4Go">START WINDOW REVIEW</button></div>`;openModal();document.getElementById('brief4Intel').onclick=()=>{closeModal();render('map4');setTimeout(openIntel4,40)};document.getElementById('brief4Go').onclick=()=>{closeModal();windowStep4=0;maxWindowStep4=0;guideSteps.map4=0;guideOpen=true;render('map4')}}
function openIntel4(){modalCard.className='modal';modalContent.innerHTML=`<div class="eyebrow">Mission 04 · Quick Intel</div><h2>Night sensitivity is a changing context, not a hidden rule</h2><p class="lead">You do not need acoustics or scheduling expertise. Read only three relative signals in this fictional scenario.</p><div class="modalGrid"><div class="fact"><small>COMMUNITY SENSITIVITY</small><strong>How vulnerable the nearby receptor is in that window</strong><em>HIGH means the same activity can create more disturbance in the scenario.</em></div><div class="fact"><small>HABITAT ACTIVITY</small><strong>How active the fictional sensitive habitat is</strong><em>This may change during the night.</em></div><div class="fact"><small>READINESS MARGIN</small><strong>How much schedule buffer remains</strong><em>Later windows leave less recovery time before handover.</em></div><div class="fact"><small>TIME CONTROL</small><strong>Choose when, not whether, the activity happens</strong><em>The mission requirement remains mandatory.</em></div></div><div class="intelExplain"><strong>Important:</strong> all times, receptors and sensitivity levels are fictional game values. They are not operational instructions or legal noise limits.</div><div class="modalActions"><button class="btn" id="intel4Go">BACK TO WINDOW REVIEW</button></div>`;openModal();document.getElementById('intel4Go').onclick=closeModal}

function openBriefing5(first=false){modalCard.className='modal wide';modalContent.innerHTML=`<div class="eyebrow">Mission 05 · Noise Complaint Investigation</div><h2>A required activity produced more community noise exposure than expected. Find out why.</h2><p class="lead">The fictional night validation activity has already happened. At 22:18 a nearby community receptor reports unexpected disturbance. Your job is to reconstruct <strong>why the actual noise exposure changed</strong> — not to decide whether noise exists.</p><div class="missionCore"><div class="coreCard"><small>WHAT YOU OBSERVED</small><strong>Higher community noise exposure</strong><span>A complaint and a rising acoustic signal trigger the investigation.</span></div><div class="coreCard"><small>WHAT YOU MUST EXPLAIN</small><strong>Why planned ≠ actual exposure</strong><span>Check propagation, actual timing and the final control step.</span></div><div class="coreCard"><small>WHAT YOU CHANGE LAST</small><strong>The operational noise control</strong><span>Reduce recurrence while keeping the required activity possible.</span></div></div><div class="ruleBox"><strong>How the mission works:</strong> four evidence items appear one at a time. Once revealed, you can return to any of them. After all four, build one noise finding and choose one corrective control.</div><div class="plainFlow"><div class="plainStep"><b>1</b><strong>Read the noise trace</strong><span>What changed at the receptor?</span></div><div class="plainStep"><b>2</b><strong>Check propagation</strong><span>Did weather change where sound travelled?</span></div><div class="plainStep"><b>3</b><strong>Check actual timing</strong><span>Did the activity start in the same window?</span></div><div class="plainStep"><b>4</b><strong>Check the final control</strong><span>Were current noise conditions revalidated?</span></div></div><div class="modalActions"><button class="btn secondary" id="brief5Intel">HOW SHOULD I READ NOISE DATA?</button><button class="btn" id="brief5Go">START NOISE INVESTIGATION</button></div>`;openModal();document.getElementById('brief5Intel').onclick=()=>{closeModal();render('map5');setTimeout(openIntel5,40)};document.getElementById('brief5Go').onclick=()=>{closeModal();evidenceStep5=0;maxEvidenceStep5=0;guideSteps.map5=0;guideOpen=true;render('map5')}}
function openIntel5(){modalCard.className='modal';modalContent.innerHTML=`<div class="eyebrow">Mission 05 · Noise Intel</div><h2>Read the change in exposure — do not invent a legal conclusion</h2><p class="lead">You only need four ideas to investigate this fictional noise event.</p><div class="modalGrid"><div class="fact"><small>ACOUSTIC SIGNAL</small><strong>Shows that receptor exposure changed</strong><em>The fictional dB(A) values help compare game states; they are not legal limits.</em></div><div class="fact"><small>PROPAGATION</small><strong>Weather can change where sound is received</strong><em>A wind shift can increase downwind exposure without changing the source activity.</em></div><div class="fact"><small>ACTUAL TIMING</small><strong>The executed window matters</strong><em>A delayed start can place the same activity in a different sensitivity context.</em></div><div class="fact"><small>OPERATIONAL NOISE CONTROL</small><strong>The plan must still fit current conditions</strong><em>If relevant conditions change, the pre-execution decision may need to be rechecked.</em></div></div><div class="intelExplain"><strong>Sustainability connection:</strong> the aim is not to claim a “silent” operation. It is to avoid preventable disturbance by adapting a required activity to the environmental conditions that actually exist when it is executed.</div><div class="modalActions"><button class="btn" id="intel5Go">BACK TO NOISE INVESTIGATION</button></div>`;openModal();document.getElementById('intel5Go').onclick=closeModal}

function openDecision1(){modalCard.className='modal wide';selectedChoice1=null;modalContent.innerHTML=`<div class="eyebrow">Mission 01 · Decision Point</div><h2>Same mandatory engine test. Three ways to execute it.</h2><p class="lead">Choose the operational control that determines <strong>when or where</strong> the test happens.</p><div class="choices"><button class="choice" data-choice="now"><span class="code">OPTION A</span><h3>Run now</h3><p>Maximum readiness, but current exposure conflict remains.</p></button><button class="choice" data-choice="delay"><span class="code">OPTION B</span><h3>Delay 30 min</h3><p>Timing control: retain the deadline with lower predicted exposure.</p></button><button class="choice" data-choice="move"><span class="code">OPTION C</span><h3>Move test area</h3><p>Community exposure falls, but habitat interaction increases.</p></button></div><div class="modalActions"><button class="btn" id="confirmDecision1" disabled>USE THIS CONTROL</button></div>`;openModal();document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selectedChoice1=el.dataset.choice;document.getElementById('confirmDecision1').disabled=false});document.getElementById('confirmDecision1').onclick=()=>openOutcome1(selectedChoice1)}
function openOutcome1(key){if(!key)return;const c=choices1[key];modalCard.className='modal wide';modalContent.innerHTML=`<div class="eyebrow">Mission 01 · What your decision caused</div><h2>${c.title}</h2><div class="outcomePlain"><div class="outcomePill"><small>Mission readiness</small><strong>${c.readinessLabel}</strong></div><div class="outcomePill"><small>Community noise</small><strong>${c.communityLabel}</strong></div><div class="outcomePill"><small>Habitat interaction</small><strong>${c.habitatLabel}</strong></div><div class="outcomePill"><small>Control risk</small><strong>${c.controlLabel}</strong></div></div><div class="outcome"><div class="scorePanel"><div class="status">${c.status}</div><h3>What happened?</h3><p>${c.text}</p><div class="whyBox"><small>WHY?</small><p>${c.why}</p></div></div><div class="learnPanel"><div class="unlock">Sustainability insight unlocked</div><h3>${c.insight}</h3><p>Timing, location, weather and receptor sensitivity can change the consequence of the same required operation.</p></div></div><div class="modalActions"><button class="btn" id="finish1">FINISH MISSION 01</button></div>`;openModal();document.getElementById('finish1').onclick=()=>{m1Complete=true;closeModal();guideSteps.complete1=0;guideOpen=true;render('complete1')}}
function openOutcome2(key){if(!key)return;const c=routes2[key];modalCard.className='modal wide';modalContent.innerHTML=`<div class="eyebrow">Mission 02 · Route outcome</div><h2>${c.code} · ${c.name}</h2><p class="lead">The fictional training sortie is complete. Now evaluate what your spatial control did to the rest of the system.</p><div class="outcomePlain"><div class="outcomePill"><small>Mission readiness</small><strong>${c.readiness}</strong></div><div class="outcomePill"><small>Community exposure</small><strong>${c.community}</strong></div><div class="outcomePill"><small>Habitat interaction</small><strong>${c.habitat}</strong></div><div class="outcomePill"><small>Cumulative exposure</small><strong>${c.cumulative}</strong></div></div><div class="outcome"><div class="scorePanel"><div class="status">${c.status}</div><h3>What happened?</h3><p>${c.text}</p><div class="whyBox"><small>WHY?</small><p>${c.why}</p></div></div><div class="learnPanel"><div class="unlock">Sustainability insight unlocked</div><h3>${c.insight}</h3><p>The route itself can be an operational environmental control. The important question is not whether the line moved, but whether total interaction with sensitive receptors was actually reduced.</p><div class="takeaway"><strong>Remember:</strong> spatial planning must consider impact transfer and cumulative exposure, not only the most visible receptor.</div></div></div><div class="modalActions"><button class="btn" id="finish2">FINISH MISSION 02</button></div>`;openModal();document.getElementById('finish2').onclick=()=>{m2Complete=true;closeModal();guideSteps.complete2=0;guideOpen=true;render('complete2')}}

function openHowToPlay(){if(current==='start'||current==='campaignIntro'){render('campaignIntro');return}const m=missionOf(current);if(String(current).startsWith('theory')){render('campaignIntro');return}m===6?openBriefing6(false):m===5?openBriefing5(false):m===4?openBriefing4(false):m===3?openBriefing3(false):m===2?openBriefing2(false):openBriefing1(false)}
function openModal(){modalCard.scrollTop=0;modalLayer.classList.add('open')}function closeModal(){modalLayer.classList.remove('open')}document.getElementById('modalClose').onclick=closeModal;modalLayer.onclick=e=>{if(e.target===modalLayer)closeModal()};document.getElementById('helpBtn').onclick=openHowToPlay;navBack.onclick=goBack;navRestart.onclick=restartMission;navHome.onclick=goHome;
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2400)}
let resizeRAF=0;addEventListener('resize',()=>{cancelAnimationFrame(resizeRAF);resizeRAF=requestAnimationFrame(()=>render(current))});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render('start');
</script>
</body></html>

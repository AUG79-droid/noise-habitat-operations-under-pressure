name: Install Noise Habitat Course v3

on:
  push:
    paths:
      - 'course-v3.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack approved course
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/noise-habitat-course
          mkdir -p /tmp/noise-habitat-course
          unzip -oq course-v3.zip -d /tmp/noise-habitat-course
          SRC=$(find /tmp/noise-habitat-course -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$SRC" ]; then
            SRC=/tmp/noise-habitat-course
          fi
          rm -rf assets payload
          rm -f index.html README.md .deploy-trigger
          cp -a "$SRC"/. .
          rm -f course-v3.zip
          rm -f .github/workflows/deploy-course.yml

      - name: Commit installed course
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Noise & Habitat Course Edition v3" || exit 0
          git push

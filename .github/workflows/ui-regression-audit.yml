name: UI Regression Audit (EN and ES)
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - localization.js
      - accessible-missions.js
      - accessible-missions.css
      - .github/workflows/ui-regression-audit.yml
jobs:
  inspect-all-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Exercise every screen in both languages
        run: |
          python3 -m http.server 8080 >/tmp/nh-server.log 2>&1 &
          node <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const screenNames=['start','campaignIntro','map1','ground1','complete1','theory1','map2','complete2','theory2','map3','complete3','theory3','map4','complete4','theory4','map5','complete5','theory5','map6','complete6','theory6'];
            const records=[]; const errors=[];
            for(const locale of ['es','en']){
              for(const size of [{w:1440,h:900,label:'desktop'},{w:390,h:844,label:'mobile'}]){
                const page=await browser.newPage({viewport:{width:size.w,height:size.h},deviceScaleFactor:1});
                page.on('pageerror',e=>errors.push(locale+'/'+size.label+' SCRIPT '+e.message));
                await page.goto('http://127.0.0.1:8080/?hubLang='+locale,{waitUntil:'load'});
                await page.waitForTimeout(350);
                for(const screen of screenNames){
                  const info=await page.evaluate((screen)=>{
                    guideOpen=false;
                    if(screen==='ground1')guideSteps.ground1=0;
                    render(screen);
                    return {current:current,loaded:!!document.querySelector('.screen')||!!document.querySelector('.coursePage')};
                  },screen);
                  await page.waitForTimeout(160);
                  const result=await page.evaluate((screen)=>{
                    const $=sel=>document.querySelector(sel),all=sel=>[...document.querySelectorAll(sel)];
                    const box=el=>{const r=el.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
                    const screenEl=$('.screen'),pageEl=$('.coursePage'),done=$('.completionScreen');
                    const a={screen,current,completion:!!done,course:!!pageEl,hasScreen:!!screenEl};
                    if(done){a.heading=$('.completionHeading')?.textContent;a.cta=$('.completionButton')?.textContent;a.duplicateOld=!!$('.esCompleteMain');a.cardCount=all('.completionCard').length;
                      a.cardOverflow=all('.completionCard').filter(x=>x.scrollWidth>x.clientWidth+4).length}
                    if(/^map[2-6]$/.test(screen)){
                      const container=$('.readableMission');
                      a.readableLayout=!!container;
                      a.layoutChildren=container?.children.length||0;
                      const paras=[...container?.querySelectorAll('h3,p,.plain,.meaning,.m2-bottom-copy span,.m2-bottom-copy strong')||[]];
                      a.minBodyFont=paras.length?Math.min(...paras.map(x=>parseFloat(getComputedStyle(x).fontSize))):null;
                      a.readableScrollable=!!container && container.scrollHeight>=container.clientHeight;
                      a.visibleActions=[...container?.querySelectorAll('button:not(:disabled)')||[]].filter(x=>x.getBoundingClientRect().width>0).length;
                    }
                    if(screen==='map1'&&location.search.includes('hubLang=es')){
                      a.timelineHours=all('.esTimelineTimes span').map(e=>e.textContent);a.warn=!!$('.esMapCond .warn');
                      a.warnColor=$('.esMapCond .warn')?getComputedStyle($('.esMapCond .warn')).backgroundColor:'';
                    }
                    if(screen==='campaignIntro'||screen.startsWith('theory'))a.heading=pageEl?.querySelector('h1')?.textContent;
                    const controls=all('.completionButton,.courseBtn,.guide-action').filter(x=>box(x).w&&box(x).h);
                    a.tinyButtons=controls.filter(el=>parseFloat(getComputedStyle(el).fontSize)<12).length;
                    return a;
                  },screen);
                  result.language=locale;result.viewport=size.label;
                  records.push(result);
                  if(!info.loaded||!result.hasScreen&&!result.course)errors.push(locale+'/'+size.label+'/'+screen+' failed to render');
                  if(screen.startsWith('complete')&&(!result.completion||result.duplicateOld||result.cardCount!==2))errors.push(locale+'/'+size.label+'/'+screen+' completion invalid '+JSON.stringify(result));
                  if(screen==='map1'&&locale==='es'&&result.timelineHours?.length!==7)errors.push(locale+'/'+size.label+'/map1 missing timeline');
                  if(result.tinyButtons>0)errors.push(locale+'/'+size.label+'/'+screen+' tiny buttons '+result.tinyButtons);
                  if(/^map[2-6]$/.test(screen)&&(!result.readableLayout||result.layoutChildren<6||result.visibleActions<3))errors.push(locale+'/'+size.label+'/'+screen+' readable-stage not installed '+JSON.stringify(result));
                  if(size.label==='desktop')await page.screenshot({path:'screens/'+locale+'-'+screen+'.png'}).catch(async()=>{fs.mkdirSync('screens',{recursive:true});await page.screenshot({path:'screens/'+locale+'-'+screen+'.png'});});

                  if(size.label==='desktop'&&/^(map|ground|complete)[1-6]$/.test(screen)){
                    const steps=await page.evaluate(screen=>guideScripts[screen]?.length||0,screen);
                    for(let i=0;i<steps;i++){
                      await page.evaluate(({screen,i})=>{guideOpen=true;guideSteps[screen]=i;render(screen);},{screen,i});
                      await page.waitForTimeout(80);
                      const audit=await page.evaluate(()=>{
                        const dock=document.querySelector('.guide-dock');
                        const actions=[...document.querySelectorAll('.guide-actions .guide-action')];
                        const rect=(e)=>e.getBoundingClientRect();
                        const collide=(a,b)=>{const x=rect(a),y=rect(b);return x.right>y.left&&y.right>x.left&&x.bottom>y.top&&y.bottom>x.top};
                        let collisions=0;for(let k=0;k<actions.length;k++)for(let j=k+1;j<actions.length;j++)if(collide(actions[k],actions[j]))collisions++;
                        return {visible:!!dock,buttons:actions.length,collisions,message:!!document.querySelector('.guide-message')};
                      });
                      if(!audit.visible||audit.collisions||!audit.message)errors.push(locale+'/'+screen+'/guide'+(i+1)+' invalid '+JSON.stringify(audit));
                      await page.screenshot({path:'screens/'+locale+'-'+screen+'-guide-'+(i+1)+'.png'});
                    }
                  }
                  if(size.label==='desktop'&&/^map[1-6]$/.test(screen)){
                    const choiceMap={
                      map1:['openDecision1','openIntel1'],
                      map2:['openRouteComparison2','openIntel2'],
                      map3:['openDecision3','openIntel3'],
                      map4:['openWindowComparison4','openIntel4'],
                      map5:['openFinding5','openIntel5'],
                      map6:['openAuditCase6','openIntel6']
                    };
                    for(const modalName of choiceMap[screen]||[]){
                      let result={ok:false};
                      try{
                        result=await page.evaluate(name=>{
                          guideOpen=false;
                          const fn=window[name]||eval(name);
                          fn();
                          const layer=document.querySelector('#modalLayer');
                          const items=[...layer.querySelectorAll('p,h3,button,.choice,.modalActions,.plain')];
                          const shown=items.filter(e=>{const x=e.getBoundingClientRect();return x.width>0&&x.height>0});
                          return {ok:layer.classList.contains('open'),count:shown.length,
                            minTextSize:Math.min(...shown.filter(x=>x.matches('p,h3,.choice,.plain')).map(x=>parseFloat(getComputedStyle(x).fontSize)),1000),
                            width:layer.querySelector('.modal')?.getBoundingClientRect().width||0};
                        },modalName);
                        await page.waitForTimeout(60);
                        await page.screenshot({path:'screens/'+locale+'-'+screen+'-'+modalName+'.png'});
                        await page.evaluate(()=>closeModal());
                      }catch(e){errors.push(locale+'/'+screen+'/'+modalName+' modal exception '+e.message)}
                      if(!result.ok||result.count<3||result.width<180)errors.push(locale+'/'+screen+'/'+modalName+' invalid '+JSON.stringify(result));
                    }
                  }
                  if(size.label==='desktop'&&/^map[1-6]$/.test(screen)){
                    await page.evaluate((screen)=>{guideOpen=false;render(screen);const m=Number(screen.slice(-1));window['openBriefing'+m](false);},screen);
                    await page.waitForTimeout(100);
                    const modalInfo=await page.evaluate(()=>({visible:document.getElementById('modalLayer').classList.contains('open'),heading:document.querySelector('.modal h2')?.textContent}));
                    if(!modalInfo.visible)errors.push(locale+'/'+screen+'/briefing dialog missing');
                    await page.screenshot({path:'screens/'+locale+'-'+screen+'-briefing.png'});
                    await page.evaluate(()=>closeModal());
                  }

                }
                await page.close();
              }
            }
            await browser.close();
            fs.writeFileSync('ui-audit.json',JSON.stringify({screenCount:records.length,results:records,errors},null,2));
            console.log('UI_AUDIT_RESULT='+JSON.stringify({screenCount:records.length,errors,screenNames}));
            if(errors.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Upload audit screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-habitat-screen-audit
          path: |
            screens/
            ui-audit.json
          if-no-files-found: warn

name: Deploy static apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Year 15 Challenge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf year-15-challenge
          unzip -q year-15-challenge.zip
          test -f year-15-challenge/index.html
          test -f year-15-challenge/app.css
          test -f year-15-challenge/app.js
          rm -f year-15-challenge.zip
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful Year 15 deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deployment_status
          printf 'The Year 15 Challenge deployed successfully\nsource_commit=%s\npage_url=%s\nutc=%s\n' "$GITHUB_SHA" "${{ steps.deployment.outputs.page_url }}year-15-challenge/" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deployment_status/year-15-challenge.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment_status/year-15-challenge.txt
          git commit -m "[skip ci] Record successful Year 15 Challenge deployment" || true
          git push
